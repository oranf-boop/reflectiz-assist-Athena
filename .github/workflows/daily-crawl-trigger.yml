name: Daily Crawl Trigger (independent of Base44 automations)

# Runs the same scheduledCrawl invocation Base44's own "Daily Website Crawl"
# automation is supposed to run, from a scheduler we can actually see the run
# history for. Base44's automation has a demonstrated history of silently
# failing for days/weeks (insufficient integration credits, then "Functions
# are blocked" -- both billing-related) with zero external signal. This
# workflow is deliberately redundant with that automation, not a replacement
# for it -- both are left running. If Base44's automation is healthy, this
# just re-confirms freshness; if it's silently dead again, this is the one
# that still fires and that we get a visible failure notification for.

on:
  # Schedule disabled 2026-09-01: this was firing daily and failing every time
  # (~4-8s in, immediately) because the BASE44_API_KEY secret this step needs
  # was never added to the repo -- confirmed via the GitHub API that this repo
  # has zero Actions secrets configured, and via the failing run's own log,
  # which shows an empty "Authorization: Bearer " header and Base44 rejecting
  # it with HTTP 500 "Invalid authorization header format". Not a transient
  # issue, so left disabled rather than left failing loudly every day. Base44's
  # own "Daily Website Crawl" automation (the thing this was meant as a backup
  # for) has been healthy since it was fixed separately, so there's no
  # coverage gap from turning this off -- just no backup notification anymore.
  # workflow_dispatch below still works, so this can still be run manually, or
  # re-enable the schedule below once BASE44_API_KEY is actually added.
  # schedule:
  #   - cron: "0 3 * * *"
  workflow_dispatch: {}

jobs:
  trigger-crawl:
    runs-on: ubuntu-latest
    steps:
      - name: POST to scheduledCrawl
        id: trigger
        run: |
          http_code=$(curl -s -o /tmp/response.json -w "%{http_code}" -X POST \
            "https://api.base44.app/api/apps/69edc5de1c84c71c086635e0/functions/scheduledCrawl" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.BASE44_API_KEY }}" \
            -d '{}')
          echo "HTTP status: $http_code"
          echo "Response body:"
          cat /tmp/response.json
          echo ""
          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "::error::scheduledCrawl returned HTTP $http_code -- treating as failure so this shows up in Actions history."
            exit 1
          fi
